[workspace]
members = ["crates/*", "crates/ts21/server", "crates/ts21/client", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "3.0.2"
license = "MIT"

[profile.dev]
panic = "abort"        # unwinding across the C ABI is UB; be explicit
# The installed default (`cargo xtask install` without --release) is this profile, and with
# `panic = "abort"` an overflow check kills the whole engine. Integers wrap as in TS's C (and as
# in release builds); unit tests keep the checks (`profile.test` below).
overflow-checks = false

[profile.test]
overflow-checks = true

# Optimized for size: GoldSrc game code is light, and the stripped libraries are ~9x smaller than
# an unstripped `opt-level = 3` build. Rust has no fast-math, so float results don't change. The
# build keeps full debug info: `cargo xtask --release` strips copies of the libraries for shipping,
# `--release-debug` ships them as built, so the debug build symbolizes the release build's crashes.
[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
