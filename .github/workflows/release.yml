# Builds the four targets and publishes a GitHub release when a `v*` tag is pushed:
#   the-specialists-rs-<tag>-<platform>.{zip,tar.gz}        optimized, stripped (cargo xtask --release dist)
#   the-specialists-rs-<tag>-<platform>-debug.{zip,tar.gz}  the same libraries with debug info
#                                                            (--release-debug), for symbolizing crashes
# The names are a contract: the TS launcher (the-specialists-mod/ts-installer) takes the latest
# release's asset ending in `-<platform>.zip` or `-<platform>.tar.gz`, so keep the prefix, the
# platform names and the extensions; the "Check asset names" step fails the run otherwise.
# Each archive holds a ts/ directory to copy over a TS 3.0 install's ts/. A manual run
# (workflow_dispatch) builds the archives as a workflow artifact without publishing a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 for its clang 18: bindgen with 22.04's clang 14 fails on the MinGW intrinsics headers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # goldsrc-sys generates its bindings from the FWGS headers (found as ./xash3d-fwgs).
      - name: FWGS headers
        run: |
          git clone --filter=blob:none https://github.com/FWGS/xash3d-fwgs xash3d-fwgs
          git -C xash3d-fwgs checkout 51353ff8d65e58300eeb2bd014867673f1f367c6
          git -C xash3d-fwgs submodule update --init 3rdparty/library_suffix

      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib mingw-w64 libclang-dev zip
          rustup toolchain install stable --profile minimal \
            --target i686-unknown-linux-gnu,x86_64-unknown-linux-gnu,i686-pc-windows-gnu,x86_64-pc-windows-gnu
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="${GITHUB_SHA::7}"
          mkdir -p out
          for variant in release release-debug; do
            rm -rf dist
            cargo xtask --$variant dist
            suffix=""
            [[ $variant == release-debug ]] && suffix="-debug"
            for dir in dist/*/; do
              platform=$(basename "$dir")
              name="the-specialists-rs-$version-$platform$suffix"
              case $platform in
                windows-*)
                  # The engines load these with only system DLLs available: no MinGW runtime.
                  if objdump -p "$dir"ts/*/*.dll | grep -iE 'DLL Name: (libgcc|libwinpthread|libstdc)'; then
                    echo "$platform links a MinGW runtime DLL" >&2
                    exit 1
                  fi
                  (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" ts) ;;
                *) tar -C "$dir" -czf "out/$name.tar.gz" ts ;;
              esac
            done
          done
          ls -l out

      # The launcher finds a release's archives by these exact names (see the header).
      - name: Check asset names
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="${GITHUB_SHA::7}"
          expected=()
          for suffix in "" -debug; do
            for platform in linux-i686 linux-x86_64; do expected+=("the-specialists-rs-$version-$platform$suffix.tar.gz"); done
            for platform in windows-i686 windows-x86_64; do expected+=("the-specialists-rs-$version-$platform$suffix.zip"); done
          done
          diff <(printf '%s\n' "${expected[@]}" | sort) <(ls out | sort) || {
            echo "release assets don't match the names the launcher expects" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: the-specialists-rs
          path: out/*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
