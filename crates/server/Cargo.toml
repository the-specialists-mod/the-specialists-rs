[package]
name = "ts-server"
edition.workspace = true
version.workspace = true

[lib]
name = "ts"                # -> libts.so / ts.dll; xtask installs dlls/ts_i386.so, ts_amd64.so, mp.dll
crate-type = ["cdylib"]

[dependencies]
goldsrc = { path = "../goldsrc", features = ["server"] }
shared  = { path = "../shared" }
