[package]
name = "ts-client-dll"
edition.workspace = true
version.workspace = true

# The engine-facing half of the client library: every exported symbol and engine callback, and
# the only place (with goldsrc) where `unsafe` is allowed. Game logic lives in `ts-client`.
[lib]
name = "client"
crate-type = ["cdylib"]

[dependencies]
goldsrc   = { path = "../goldsrc", features = ["client"] }
shared    = { path = "../shared" }
ts-client = { path = "../client" }
