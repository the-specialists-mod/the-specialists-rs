[package]
name = "ts21-client"
edition.workspace = true
version.workspace = true
license.workspace = true

# The client half of the TS 2.1 gameplay plugin (docs/implementation/ts21.md): `ClientRules` and
# the client's plugin object. Only `client-dll` links it, behind its `ts21` feature.
[dependencies]
ts21-gameplay = { path = ".." }
ts-client     = { path = "../../client" }
goldsrc       = { path = "../../goldsrc", features = ["client"] }

[dev-dependencies]
# Tests only; the 3.0 packages: see ../Cargo.toml.
shared        = { path = "../../shared" }
ts30-gameplay = { path = "../../ts30" }
ts30-client   = { path = "../../ts30/client" }
