[package]
name = "tsmod-test"
description = "The stub tsmod_* plugin: loader tests and a trivial bot backend (walks and jumps)"
edition.workspace = true
version.workspace = true
license.workspace = true

# A plugin library is FFI from end to end (its export, the API's function pointers, the engine's
# tables), so like the *-dll crates it may use `unsafe` (AGENTS.md). It is a test fixture: xtask
# builds and installs it for the dev roots, never into dist/.
[lib]
name = "tsmod_test"        # -> libtsmod_test.so / tsmod_test.dll; xtask installs dlls/tsmod_test<suffix>
crate-type = ["cdylib", "rlib"]

[dependencies]
goldsrc-sys = { path = "../goldsrc-sys" }
ts-plugin-api = { path = "../plugin-api" }
